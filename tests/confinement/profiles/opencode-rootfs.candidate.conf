# REVIEW-ONLY candidate, NOT INSTALLED/STARTED/fully validated as a systemd unit.
# Do not copy to a live .service.d directory. See README and ROLLOUT.md.
# The kernel fixture tests the relevant rootfs/mount/seccomp primitives, with
# PRIVATE PID namespaces. systemd255 has no PrivatePIDs= equivalent here.
# This draft instead hides /proc entirely; OpenCode compatibility is UNVERIFIED.
# Before use: build/review rootfs closure and fixed bootstrap; dedicated UID/state;
# solve own-credential separation and egress policy; obtain explicit rollout.
[Unit]
ConditionPathExists=/etc/harness-bridge/confinement-rollout-approved

[Service]
RootDirectory=/var/lib/opencode-hb-confinement/rootfs
MountAPIVFS=yes
WorkingDirectory=/opt/harness-bridge-test/workspace
# Operator-approved fixed bindings only. Never accept repository/client paths.
BindPaths=/opt/harness-bridge-test/workspace:/opt/harness-bridge-test/workspace
BindPaths=/var/lib/opencode-hb-confinement/state:/var/lib/opencode-hb
BindPaths=/var/cache/opencode-hb-confinement:/var/cache/opencode-hb
TemporaryFileSystem=/tmp:rw,nosuid,nodev,noexec,mode=1777 /var/tmp:rw,nosuid,nodev,noexec,mode=1777
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/opt/harness-bridge-test/workspace /var/lib/opencode-hb /var/cache/opencode-hb /tmp /var/tmp
NoExecPaths=/
ExecPaths=/usr /lib /lib64 /opt/harness-bridge-test/workspace
# No host /proc/root FD escapes. This is a DIFFERENCE from the fixture's private
# PID/proc namespace and must pass a real native startup/tool compatibility audit.
InaccessiblePaths=/proc
PrivateDevices=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=~@mount @debug @raw-io @reboot @swap
# Network-compatible option: keeps Bridge loopback/API/provider transport.
# AF_UNIX denial may break tools; no network-isolation claim. Egress is a gate.
PrivateNetwork=no
RestrictAddressFamilies=AF_INET AF_INET6
UMask=0077
Restart=no
# No automatic runtime tree creation or production credential/session copying.
# A fixed, root-owned bootstrap inside the image is a future deliverable.
# It must execute only the reviewed OpenCode binary, never caller shell/paths.
ExecStart=
ExecStart=/usr/local/libexec/opencode-confined-bootstrap
