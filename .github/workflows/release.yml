name: Release

# ADR-026 section 3: the release pipeline. It starts ONLY when the maintainer pushes a v* tag; no branch push,
# pull request, schedule or manual dispatch can start it. It builds, gates, signs and creates a DRAFT GitHub
# release; the maintainer reviews the draft and publishes it by hand (section 3.2). It uses no secret other than
# the built-in token, creates no tag, no environment and no repository setting, and publishes to no channel.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build, gate, sign and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify that this run is a version tag on a clean checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $GITHUB_REF_NAME" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false

      - name: Verify toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.2

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0

      - name: Put syft on the PATH
        run: |
          set -euo pipefail
          dirname "${{ steps.syft.outputs.cmd }}" >> "$GITHUB_PATH"

      # Gate 1, before anything is created: the GoReleaser build must be clean and must equal the plain recipe.
      - name: Build with GoReleaser (no release yet)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: build --clean

      - name: Gate the built binaries
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r bin; do
            scripts/release/check-binary.sh "$bin" "$GITHUB_SHA"
            count=$((count + 1))
          done < <(find dist -type f -name cirak | sort)
          test "$count" -eq 4 || { echo "expected 4 binaries, found $count" >&2; exit 1; }
          arm64=$(find dist -type f -path '*linux_arm64*' -name cirak | head -n 1)
          scripts/release/plain-build.sh linux arm64 "$RUNNER_TEMP/cirak-linux-arm64"
          cmp "$arm64" "$RUNNER_TEMP/cirak-linux-arm64" || {
            echo 'the GoReleaser linux/arm64 binary differs from the plain recipe' >&2
            exit 1
          }

      # The release: archives, checksums, SBOMs, the cosign bundle of checksums.txt and a DRAFT GitHub release.
      - name: Create the draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 2, on what was released: every archive is listed in checksums.txt, holds a clean binary of this
      # revision, and the linux/arm64 binary equals the plain recipe.
      - name: Gate the archives
        run: scripts/release/check-archives.sh dist "$GITHUB_SHA"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/cirak_*_*.tar.gz
            dist/checksums.txt
            install.sh

      - name: Keep the archives for the independent rebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/cirak_*_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  reproduce:
    name: Independent rebuild
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false

      - name: Verify toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.2

      - name: Fetch the archives of the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # A mismatch fails this job and the workflow; the release stays a draft.
      - name: Rebuild with the plain recipe and compare every binary
        run: scripts/release/reproduce.sh dist
