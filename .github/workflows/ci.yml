name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
      TEST_LOG_DIR: ${{ runner.temp }}/harness-bridge-ci
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false

      - name: Verify toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.2

      - name: Verify formatting
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          unformatted=$(gofmt -l "${go_files[@]}")
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          mkdir -p "$TEST_LOG_DIR"
          go test ./... -count=1 -json | tee "$TEST_LOG_DIR/test.jsonl"

      - name: Race test
        run: |
          mkdir -p "$TEST_LOG_DIR"
          go test -race ./... -count=1 -json | tee "$TEST_LOG_DIR/race.jsonl"

      - name: Report skipped tests
        if: ${{ always() }}
        run: |
          {
            printf '## Test coverage limits\n\n'
            printf 'Unit and fixture integration checks do not establish real native OpenCode or Claude Chat E2E acceptance.\n\n'
            for suite in test race; do
              printf '### %s\n\n' "$suite"
              log="$TEST_LOG_DIR/$suite.jsonl"
              if [[ -f "$log" ]]; then
                count=$(jq -s '[.[] | select(.Action == "skip" and .Test != null)] | length' "$log")
                printf 'Skipped tests: %s. Skips are not PASS.\n\n' "$count"
                jq -r 'select(.Action == "skip" and .Test != null) | "- " + .Package + ": " + .Test' "$log"
              else
                printf 'No test log: suite was not executed; not PASS.\n'
              fi
              printf '\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"
