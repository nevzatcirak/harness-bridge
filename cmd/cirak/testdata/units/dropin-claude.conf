# Written by "cirak init" (ADR-027 section 2 item 5). Nothing in it is a secret.
# Proven live on the H5 host (F-H5-3): LoadCredential=, RuntimeDirectory=, StateDirectory=.
# Proposed hardening, NOT yet verified on a live host: ProtectSystem=, PrivateTmp=, RestrictAddressFamilies=,
# NoNewPrivileges=.
# A drop-in over the packaged unit: only what this install needs. The packaged unit already runs as the
# cirak user and reads the credential below as its token file.

[Service]
Environment=CIRAK_CONFIG=/etc/cirak/config.json
# the credential list is reset, then this host's token file is the source of the credential "token"
LoadCredential=
LoadCredential=token:/etc/cirak/token
# Claude Code adapter ON: its child runs under sudo -u hbclaude, sudo is setuid and NoNewPrivileges=yes would
# break every run, so it is not set. ProtectHome=off is the chosen form (ReadWritePaths= names the adapter HOME).
NoNewPrivileges=no
ProtectHome=off
ReadWritePaths=/home/hbclaude
